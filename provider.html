<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider Profile — Local Service Connector</title>
    <meta
      name="description"
      content="View a service provider's profile, services, pricing, working hours, and customer reviews."
    />
    <meta name="theme-color" content="#0B1220" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/output.css" />
  </head>

  <body data-page="services">
    <a href="#main" class="lsc-skip">Skip to main content</a>

    <div id="site-header"></div>

    <main id="page">
      <!-- ================= BREADCRUMB ================= -->
      <div class="border-b border-slate-200 bg-white">
        <div class="lsc-container py-3.5">
          <nav aria-label="Breadcrumb">
            <ol class="flex flex-wrap items-center gap-2 text-sm text-slate-500">
              <li><a href="index.html" class="font-medium hover:text-brand-600">Home</a></li>
              <li aria-hidden="true" class="text-slate-300">/</li>
              <li><a href="services.html" class="font-medium hover:text-brand-600">Services</a></li>
              <li aria-hidden="true" class="text-slate-300">/</li>
              <li id="provider-crumb" aria-current="page" class="font-semibold text-slate-900">
                Profile
              </li>
            </ol>
          </nav>
        </div>
      </div>

      <!-- ================= PROVIDER PROFILE ================= -->
      <section class="lsc-section !py-8 lg:!py-10">
        <div class="lsc-container">
          <div id="provider-root">
            <!-- Loading state, replaced by js/services.js -->
            <div class="provider-header-card animate-pulse">
              <div class="flex flex-col gap-5 sm:flex-row sm:items-start">
                <div class="h-20 w-20 shrink-0 rounded-full bg-slate-200"></div>
                <div class="flex-1 space-y-3">
                  <div class="h-6 w-64 max-w-full rounded bg-slate-200"></div>
                  <div class="h-4 w-40 rounded bg-slate-200"></div>
                  <div class="h-4 w-72 max-w-full rounded bg-slate-100"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= RELATED ================= -->
      <section class="bg-white py-14 lg:py-16">
        <div class="lsc-container">
          <div class="mb-8 flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <span class="lsc-eyebrow">You may also like</span>
              <h2 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">
                Similar professionals
              </h2>
            </div>
            <a href="services.html" class="text-sm font-semibold text-brand-600 hover:text-brand-700">
              View all services →
            </a>
          </div>

          <div id="related-providers" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>

    <script src="https://unpkg.com/lucide@1.52.0/dist/umd/lucide.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/services.js"></script>
  </body>
</html>
